# Triggered by pushing a version tag, e.g.: git tag v1.0.1 && git push origin v1.0.1
#
# Required GitHub repository secrets:
#   APPLE_CERTIFICATE            — base64-encoded Developer ID Application .p12
#                                  export via: base64 -i cert.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD   — password used when exporting the .p12
#   APPLE_TEAM_ID                — 10-character Apple Developer Team ID
#   APPLE_ID                     — Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  — app-specific password from appleid.apple.com
#   KEYCHAIN_PASSWORD            — any random string (used for the temporary keychain)

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build archive
        run: |
          # Resolve the full identity name from the imported certificate
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          echo "Signing with: $CERT_IDENTITY"

          xcodebuild archive \
            -project TimeSquirrel.xcodeproj \
            -scheme TimeSquirrel \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/TimeSquirrel.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=YES

      - name: Export signed app
        run: |
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>$CERT_IDENTITY</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TimeSquirrel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Notarize
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/TimeSquirrel.app" \
            "$RUNNER_TEMP/TimeSquirrel-notarize.zip"

          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/TimeSquirrel-notarize.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait --output-format json)

          echo "$RESULT"
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")

          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "Notarization failed with status: $STATUS — fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}"
            exit 1
          fi

      - name: Staple notarization ticket
        run: xcrun stapler staple "$RUNNER_TEMP/export/TimeSquirrel.app"

      - name: Create DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg_staging"
          cp -r "$RUNNER_TEMP/export/TimeSquirrel.app" "$RUNNER_TEMP/dmg_staging/"
          ln -s /Applications "$RUNNER_TEMP/dmg_staging/Applications"

          hdiutil create \
            -volname "Time Squirrel" \
            -srcfolder "$RUNNER_TEMP/dmg_staging" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/TimeSquirrel-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Time Squirrel ${{ steps.version.outputs.VERSION }}" \
            --generate-notes \
            "$RUNNER_TEMP/TimeSquirrel-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
